<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Population arena lab</title><style>
:root{font:15px/1.5 system-ui,sans-serif;--bg:#f5f7fa;--card:#fff;--ink:#182230;--muted:#536273;--line:#cbd5df;--blue:#0072b2;--orange:#d55e00;--green:#00875a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1000px;margin:auto;padding:1rem}section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin:1rem 0}h1{margin:.2rem 0}h2{margin:.2rem 0 .5rem;font-size:1.2rem}.row{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}button{padding:.4rem .6rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer}canvas{width:100%;height:260px;border:1px solid var(--line);border-radius:7px}.metric{font-weight:700;color:var(--blue)}.muted{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#111820;--card:#1b2632;--ink:#edf3f8;--muted:#bdc9d4;--line:#405263;--blue:#56b4e9}}
</style></head><body><main><p><a href="../modules/11_multiplayer.md">← Module 11 lesson</a></p><h1>Population arena & ratings</h1><p class="muted">Round-robin league with non-transitive cycles.</p>
<section><h2>Matchup matrix</h2><button id="run">Run league</button><canvas id="c"></canvas><p id="out" class="muted"></p></section>
</main><script>
const $=id=>document.getElementById(id);
const bots=['Rock','Paper','Scissors','Equil'];
// non-transitive payoffs
function payoff(a,b){ if(a===b) return 0; if((a+1)%3===b && a<3 && b<3) return -1; if(a<3&&b<3) return 1; return (a===3?0.1:-0.1); }
function run(){
  const n=bots.length, M=Array.from({length:n},()=>Array(n).fill(0));
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){ if(i===j) continue; let w=0; for(let k=0;k<200;k++) w+=payoff(i,j)>0?1:0; M[i][j]=w/200; }
  const c=$('c'), ctx=c.getContext('2d'); const W=c.width=c.clientWidth*devicePixelRatio, H=c.height=260*devicePixelRatio; ctx.scale(devicePixelRatio,devicePixelRatio);
  const cw=c.clientWidth, ch=260; const cell=Math.min(cw,ch)/ (n+1);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const v=M[i][j]; ctx.fillStyle=v>0.5?'#00875a':v<0.5?'#d55e00':'#cbd5df'; ctx.fillRect(j*cell+cell, i*cell+cell, cell-2, cell-2);
    ctx.fillStyle='#182230'; ctx.fillText((v*100).toFixed(0)+'%', j*cell+cell+4, i*cell+cell+cell/2);
  }
  bots.forEach((b,i)=>{ctx.fillText(b, i*cell+cell+4, 12); ctx.fillText(b, 4, i*cell+cell+cell/2);});
  // ratings simple: avg win rate
  const r=bots.map((_,i)=>M[i].reduce((a,b,j)=>j===i?a:a+b,0)/(n-1));
  $('out').textContent='Avg win rates: '+bots.map((b,i)=>b+' '+(r[i]*100).toFixed(1)+'%').join(', ')+' — Rock/Paper/Scissors cycle is non-transitive.';
}
$('run').onclick=run; run();
</script></body></html>
