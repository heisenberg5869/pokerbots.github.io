<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLO equity lab</title><style>body{font:15px system-ui,sans-serif;background:#101820;color:#e8f1f3;margin:0;padding:20px}main{max-width:900px;margin:auto}button{padding:8px 12px;margin:4px}</style></head><body><main><h1>PLO equity lab (Monte Carlo)</h1><p>Random deals: 4 hole each, 5 board; winner by best 2+3 combination.</p><button onclick="run()">Run 2000 samples</button><div id="out"></div><script>
const ranks='23456789TJQKA';function name(c){return ranks[c%13]+['♠','♥','♦','♣'][Math.floor(c/13)]}
function fiveRank(cs){let rs=cs.map(c=>c%13+2).sort((a,b)=>b-a), ss=cs.map(c=>Math.floor(c/13)), cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);let g=Object.entries(cnt).map(([r,n])=>[+n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]), flush=ss.every(s=>s===ss[0]), u=[...new Set(rs)].sort((a,b)=>b-a);if(u[0]===14)u.push(1);let sh=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4)sh=Math.max(sh,u[i]);let t;if(flush&&sh)t=[8,sh];else if(g[0][0]===4)t=[7,g[0][1]];else if(g[0][0]===3&&g[1][0]===2)t=[6,g[0][1],g[1][1]];else if(flush)t=[5,...rs];else if(sh)t=[4,sh];else if(g[0][0]===3)t=[3,g[0][1]];else{let p=g.filter(x=>x[0]===2).map(x=>x[1]);if(p.length>=2)t=[2,...p.slice(0,2)];else if(p.length===1)t=[1,p[0]];else t=[0,...rs]}return t}
function bestPLO(hole,board){let best=null;for(let a=0;a<hole.length-1;a++)for(let b=a+1;b<hole.length;b++)for(let c=0;c<board.length-2;c++)for(let d=c+1;d<board.length-1;d++)for(let e=d+1;e<board.length;e++){const r=fiveRank([hole[a],hole[b],board[c],board[d],board[e]]);if(!best||cmp(r,best)>0)best=r}return best}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function shuffle(){return [...Array(52).keys()].sort(()=>Math.random()-.5)}
function run(){let w=0,t=0,l=0,n=2000;for(let i=0;i<n;i++){const deck=shuffle();const h0=deck.slice(0,4),h1=deck.slice(4,8),board=deck.slice(8,13);const r0=bestPLO(h0,board),r1=bestPLO(h1,board);const d=cmp(r0,r1);if(d>0)w++;else if(d<0)l++;else t++}const eq=(w+t/2)/n;document.getElementById('out').innerHTML='Samples: '+n+'<br>Hero win: '+(w/n*100).toFixed(1)+'% Tie: '+(t/n*100).toFixed(1)+'% Lose: '+(l/n*100).toFixed(1)+'%<br>Equity: '+(eq*100).toFixed(1)+'%'}
run();
</script></main></body></html>
