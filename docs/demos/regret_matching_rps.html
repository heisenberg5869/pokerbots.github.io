<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regret matching on rock-paper-scissors</title>
<style>
  :root{--bg:#fff;--fg:#1f2328;--mut:#6e7781;--line:#d0d7de;--r:#d1242f;--p:#0969da;--s:#1a7f37}
  @media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#30363d;--r:#ff7b72;--p:#79c0ff;--s:#56d364}}
  body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  label{display:flex;flex-direction:column;font-size:12px;color:var(--mut)}
  input[type=range]{width:150px}
  button{padding:5px 12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;cursor:pointer}
  canvas{width:100%;max-width:640px;height:240px;border:1px solid var(--line);border-radius:6px;display:block}
  .key span{margin-right:14px;font-weight:600} .mut{color:var(--mut);font-size:12px}
</style></head><body>
<div class="row key"><span style="color:var(--r)">■ Rock</span><span style="color:var(--p)">■ Paper</span><span style="color:var(--s)">■ Scissors</span><span class="mut" style="font-weight:400">thick = average strategy, thin = current strategy</span></div>
<div class="row">
  <label>Opponent: P(Rock) <b id="vr">0.50</b><input id="r" type="range" min="0" max="100" value="50"></label>
  <label>Opponent: P(Paper) <b id="vp">0.30</b><input id="p" type="range" min="0" max="100" value="30"></label>
  <label>Mode
    <select id="mode"><option value="fixed">vs fixed opponent</option><option value="self">self-play</option></select></label>
  <button id="go">Run</button><button id="reset">Reset</button>
</div>
<canvas id="c" width="1280" height="480"></canvas>
<div class="mut" id="info" style="margin-top:6px"></div>
<script>
const U=[[0,-1,1],[1,0,-1],[-1,1,0]]; // payoff to row player: R,P,S
let reg,sum,reg2,sum2,t,run=false,hist;
function init(){reg=[0,0,0];sum=[0,0,0];reg2=[0,0,0];sum2=[0,0,0];t=0;hist=[];}
function strat(r){const p=r.map(x=>Math.max(x,0)),s=p[0]+p[1]+p[2];return s>0?p.map(x=>x/s):[1/3,1/3,1/3];}
function opp(){let a=+r.value/100,b=+p.value/100;if(a+b>1){b=1-a;}return [a,b,Math.max(0,1-a-b)];}
function step(n){
  for(let k=0;k<n;k++){
    const s1=(t===0)?[0.6,0.2,0.2]:strat(reg);for(let i=0;i<3;i++)sum[i]+=s1[i];
    let s2; if(mode.value==="self"){s2=strat(reg2);for(let i=0;i<3;i++)sum2[i]+=s2[i];} else s2=opp();
    // expected utility of each of my actions vs opponent's strategy, and my current strategy's value
    const u=[0,1,2].map(i=>s2[0]*U[i][0]+s2[1]*U[i][1]+s2[2]*U[i][2]);
    const v=s1[0]*u[0]+s1[1]*u[1]+s1[2]*u[2];
    for(let i=0;i<3;i++)reg[i]+=u[i]-v;
    if(mode.value==="self"){
      const u2=[0,1,2].map(j=>-(s1[0]*U[0][j]+s1[1]*U[1][j]+s1[2]*U[2][j]));
      const v2=s2[0]*u2[0]+s2[1]*u2[1]+s2[2]*u2[2];
      for(let j=0;j<3;j++)reg2[j]+=u2[j]-v2;
    }
    t++;
    if(t%Math.max(1,Math.floor(t/200)+1)===0||t<200){const tot=sum[0]+sum[1]+sum[2];hist.push({t:t,avg:sum.map(x=>x/tot),cur:s1});}
  }
}
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(){
  const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=css("--line");ctx.fillStyle=css("--mut");ctx.font="22px system-ui";
  for(let g=0;g<=4;g++){const y=H-30-(H-50)*g/4;ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillText((g/4).toFixed(2),4,y+7);}
  if(hist.length<2)return;
  const cols=[css("--r"),css("--p"),css("--s")],maxT=hist[hist.length-1].t;
  for(let a=0;a<3;a++){   // thin, faint: CURRENT strategy
    ctx.strokeStyle=cols[a];ctx.globalAlpha=0.35;ctx.lineWidth=1.5;ctx.beginPath();
    hist.forEach((h,i)=>{const x=50+(W-60)*h.t/maxT,y=H-30-(H-50)*h.cur[a];i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  }
  ctx.globalAlpha=1;
  for(let a=0;a<3;a++){   // thick: AVERAGE strategy
    ctx.strokeStyle=cols[a];ctx.lineWidth=3;ctx.beginPath();
    hist.forEach((h,i)=>{const x=50+(W-60)*h.t/maxT,y=H-30-(H-50)*h.avg[a];i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  }
  ctx.fillStyle=css("--mut");ctx.fillText("iterations → "+t,W-230,H-6);
  const f=hist[hist.length-1].avg;
  info.textContent="Average strategy: R "+f[0].toFixed(3)+"  P "+f[1].toFixed(3)+"  S "+f[2].toFixed(3)+
   (mode.value==="self"?"   (equilibrium = 0.333 each)":"   (best response to opponent: "+["Rock","Paper","Scissors"][[0,1,2].map(i=>{const o=opp();return o[0]*U[i][0]+o[1]*U[i][1]+o[2]*U[i][2];}).reduce((b,x,i,a)=>x>a[b]?i:b,0)]+")");
}
function loop(){if(run){step(20);draw();}requestAnimationFrame(loop);}
[r,p].forEach(el=>el.addEventListener("input",()=>{let a=+r.value/100,b=+p.value/100;if(a+b>1)p.value=Math.round((1-a)*100);vr.textContent=(+r.value/100).toFixed(2);vp.textContent=(+p.value/100).toFixed(2);}));
go.onclick=()=>{run=!run;go.textContent=run?"Pause":"Run";};
reset.onclick=()=>{init();draw();info.textContent="";};
mode.onchange=()=>{init();draw();};
init();loop();
</script></body></html>
