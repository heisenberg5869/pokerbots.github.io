<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLO hand builder</title><style>body{font:15px system-ui,sans-serif;background:#101820;color:#e8f1f3;margin:0;padding:20px}main{max-width:900px;margin:auto}button{padding:6px 10px;margin:4px}.card{display:inline-block;padding:6px 10px;margin:2px;border:1px solid #45616c;border-radius:6px;cursor:pointer}.sel{background:#236653}.out{margin-top:12px;padding:10px;border:1px solid #314854;border-radius:8px}</style></head><body><main><h1>PLO hand builder</h1><p>Select 4 hole cards and 5 board cards, then enumerate legal 5-card hands (2 hole + 3 board).</p><div id="deck"></div><button onclick="reset()">Reset</button><div class="out" id="info">Selected: 0</div><div class="out" id="combos"></div><script>
const ranks='23456789TJQKA', suits=['♠','♥','♦','♣'];function name(c){return ranks[c%13]+suits[Math.floor(c/13)]}
let selected=[];const deckEl=document.getElementById('deck');
for(let i=0;i<52;i++){const b=document.createElement('button');b.className='card';b.textContent=name(i);b.onclick=()=>toggle(i,b);deckEl.appendChild(b)}
function toggle(c,b){if(selected.includes(c)){selected=selected.filter(x=>x!==c);b.classList.remove('sel')}else if(selected.length<9){selected.push(c);b.classList.add('sel')}update()}
function reset(){selected=[];document.querySelectorAll('.card').forEach(b=>b.classList.remove('sel'));update()}
function combos(arr,k){const out=[];function rec(start,cur){if(cur.length===k){out.push(cur.slice());return}for(let i=start;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop()}}rec(0,[]);return out}
function update(){document.getElementById('info').textContent='Selected: '+selected.length+' (need 4 hole + 5 board)';if(selected.length!==9){document.getElementById('combos').textContent='';return}const hole=selected.slice(0,4),board=selected.slice(4,9);const h2=combos(hole,2), b3=combos(board,3);let total=0, list=[];for(const hh of h2)for(const bb of b3){total++;list.push(hh.map(name).join('')+' + '+bb.map(name).join(''))}document.getElementById('combos').textContent='Legal combinations: '+total+'\n'+list.slice(0,20).join('\n')+(list.length>20?'\n...':''+'')}
</script></main></body></html>
