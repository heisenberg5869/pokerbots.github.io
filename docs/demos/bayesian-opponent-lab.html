<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayesian Opponent Lab</title>
<style>body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#f5f7fa;color:#182230}main{max-width:900px;margin:auto;padding:1rem}section{background:#fff;border:1px solid #cbd5df;border-radius:10px;padding:1rem;margin:1rem 0}button{padding:.4rem .65rem}</style></head><body><main>
<p><a href="../modules/12_opponent_modelling.md">← Module 12</a></p><h1>Bayesian Opponent Lab</h1>
<section><h2>Dirichlet posterior</h2><label>Prior alpha fold <input id="af" type="number" value="1" step="0.1"></label><label>call <input id="ac" type="number" value="1" step="0.1"></label><label>raise <input id="ar" type="number" value="1" step="0.1"></label><br>
<label>Observed fold <input id="of" type="number" value="30"></label><label>call <input id="oc" type="number" value="10"></label><label>raise <input id="or" type="number" value="5"></label><button id="upd">Update</button><p id="out"></p></section>
<script>
function upd(){const af=+document.getElementById('af').value,ac=+document.getElementById('ac').value,ar=+document.getElementById('ar').value;const of=+document.getElementById('of').value,oc=+document.getElementById('oc').value,orr=+document.getElementById('or').value;const a=[af+of,ac+oc,ar+orr],t=a.reduce((x,y)=>x+y,0);const p=a.map(x=>x/t);document.getElementById('out').textContent='Posterior mean: fold='+(p[0].toFixed(3))+' call='+(p[1].toFixed(3))+' raise='+(p[2].toFixed(3))+' (total alpha '+t.toFixed(1)+')';}
document.getElementById('upd').onclick=upd;upd();
</script></main></body></html>
