<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLO combination counter</title><style>body{font:15px system-ui,sans-serif;background:#101820;color:#e8f1f3;margin:0;padding:20px}main{max-width:700px;margin:auto}input{width:80px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #314854;padding:6px}</style></head><body><main><h1>Hold'em vs Omaha combination counts</h1><p>Enter hole-card counts.</p><label>Hold'em hole cards: <input id="he" type="number" value="2" min="1" max="4"></label><br><label>Omaha hole cards: <input id="om" type="number" value="4" min="1" max="4"></label><br><button onclick="run()">Compute</button><table id="t"></table><script>
function C(n,k){if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)}
function run(){const he=+document.getElementById('he').value, om=+document.getElementById('om').value;const board=5;const heCombos=C(he,2)*C(board,3);const omCombos=C(om,2)*C(board,3);document.getElementById('t').innerHTML='<tr><th>Game</th><th>Hole combos used</th><th>Board combos</th><th>Total 5-card hands</th></tr><tr><td>Hold\'em-style ('+he+' hole)</td><td>'+C(he,2)+'</td><td>'+C(board,3)+'</td><td>'+heCombos+'</td></tr><tr><td>Omaha-style ('+om+' hole)</td><td>'+C(om,2)+'</td><td>'+C(board,3)+'</td><td>'+omCombos+'</td></tr>'}
run();
</script></main></body></html>
